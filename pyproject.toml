[project]
name = "so-arm101-dora-node"
version = "0.1.0"
description = "SO-ARM101 vendor adapter — dora-rs node conforming to SPEC-VENDOR-NODE-V1"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    # NOTE: dora-rs is deliberately NOT here — see the `runtime` extra below.
    "pyarrow>=14",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Pinned to the dora 1.0.1 release used by octos-robot-skills. Not a hard dependency:
# __main__.py imports dora lazily, so the tests and the bring-up CLI run without it.
# On aarch64 / CPython 3.10 install the vendored wheel from octos-robot-skills first.
runtime = ["dora-rs==1.0.1"]
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.10,<3"]

[project.scripts]
so-arm101-dora-node = "so_arm101_node.__main__:main"
so-arm101 = "so_arm101_node.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["so_arm101_node*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF", "BLE"]

[tool.mypy]
python_version = "3.10"
files = ["so_arm101_node"]
ignore_missing_imports = true
